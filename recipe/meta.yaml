{% set name = "warpfield" %}
{% set version = "0.3.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/warpfield-{{ version }}.tar.gz
  sha256: 2de75203f345f8ab9d962d3a16ad8daa19a52d36feefbdf4e5911d5b0203e315

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=77
    - pip
  run:
    - python >={{ python_min }}
    - __linux  # [linux]
    - __win    # [win]
    - __osx    # [osx]
    - cupy     # [linux or win]
    - mlx >=0.32.4  # [osx]
    - numpy
    - scipy
    - tqdm
    - pydantic
    - pyyaml
    - h5py
    - hdf5plugin
    - nibabel
    - tifffile
    - pynrrd
    - zarr
    - imageio
    - imageio-ffmpeg
    - scikit-image

test:
  imports:
    - warpfield
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/danionella/warpfield
  summary: GPU-accelerated 3D non-rigid registration
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - bjudkewitz
